<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | SJL Alerta</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="barra">
    <a href="index.html" class="logo">🚨 SJL Alerta</a>
    <nav id="menu"></nav>
  </header>
  <main class="contenedor">
    <section class="formulario-caja">
      <h1>Iniciar sesión</h1>
      <p id="mensaje" class="mensaje" hidden></p>
      <form id="form-login" novalidate>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit" class="btn">Ingresar</button>
      </form>
      <p class="nota">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </section>
  </main>
  <footer class="pie">SJL Alerta · Reportes ciudadanos para un San Juan de Lurigancho más seguro</footer>
  <script type="module" src="js/ui/login.js"></script>
</body>
</html>
