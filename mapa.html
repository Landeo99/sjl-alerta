<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de zonas de riesgo | SJL Alerta</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="barra">
    <a href="index.html" class="logo">🚨 SJL Alerta</a>
    <nav id="menu"></nav>
  </header>
  <main class="contenedor">
    <section class="hero">
      <h1>Mapa de zonas de riesgo</h1>
      <p class="nota">Las zonas se colorean según la cantidad de incidentes: <span class="nivel" style="background:#d62839">Alto (10 o más)</span> <span class="nivel" style="background:#f2b705">Medio (5 a 9)</span> <span class="nivel" style="background:#2a9d5c">Bajo (menos de 5)</span>. Haz clic en una zona para ver su resumen.</p>
      <div class="filtros">
        <label>Tipo <select id="filtro-tipo"><option value="">Todos</option></select></label>
        <label>Franja horaria <select id="filtro-franja"><option value="">Todas</option></select></label>
        <button id="limpiar" class="btn btn-secundario">Quitar filtros</button>
        <span id="total" class="nota"></span>
      </div>
    </section>
    <p id="alerta" class="mensaje error" hidden></p>
    <div class="mapa-layout">
      <div id="mapa" class="mapa"></div>
      <aside id="resumen" class="tarjeta" hidden></aside>
    </div>
  </main>
  <footer class="pie">SJL Alerta · Reportes ciudadanos para un San Juan de Lurigancho más seguro</footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/ui/mapa.js"></script>
</body>
</html>
