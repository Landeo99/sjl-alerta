<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | SJL Alerta</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="barra">
    <a href="index.html" class="logo">🚨 SJL Alerta</a>
    <nav id="menu"></nav>
  </header>
  <main class="contenedor">
    <section class="formulario-caja">
      <h1>Crear cuenta</h1>
      <p class="nota">Regístrate como vecino o visitante para enviar reportes.</p>
      <form id="form-registro" novalidate>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" autocomplete="name" required>
        <small class="error-campo" data-error="nombre"></small>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
        <small class="error-campo" data-error="email"></small>
        <label for="password">Contraseña (mínimo 8 caracteres)</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <small class="error-campo" data-error="password"></small>
        <button type="submit" class="btn">Registrarme</button>
      </form>
      <p class="nota">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
  </main>
  <footer class="pie">SJL Alerta · Reportes ciudadanos para un San Juan de Lurigancho más seguro</footer>
  <script type="module" src="js/ui/registro.js"></script>
</body>
</html>
