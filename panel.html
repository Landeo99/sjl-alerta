<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de atención | SJL Alerta</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="barra">
    <a href="index.html" class="logo">🚨 SJL Alerta</a>
    <nav id="menu"></nav>
  </header>
  <main class="contenedor">
    <p id="mensaje" class="mensaje" hidden></p>
    <section class="hero">
      <h1>Panel de atención</h1>
      <p id="bienvenida"></p>
      <div class="filtros">
        <label>Estado <select id="filtro-estado"><option value="">Todos</option></select></label>
        <button id="exportar" class="btn btn-secundario">Exportar CSV</button>
        <span id="conteo" class="nota"></span>
      </div>
    </section>
    <section class="caja-tabla">
      <table class="tabla">
        <thead><tr><th>Código</th><th>Estado</th><th>Tipo</th><th>Zona</th><th>Fecha y hora</th><th>Autor</th><th>Descripción</th><th>Acción</th></tr></thead>
        <tbody id="tabla-reportes"></tbody>
      </table>
    </section>
  </main>
  <footer class="pie">SJL Alerta · Reportes ciudadanos para un San Juan de Lurigancho más seguro</footer>
  <script type="module" src="js/ui/panel.js"></script>
</body>
</html>
